<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Motif Mixtapes</title>
  <!--
    Public index of mixtapes, served at /motif/mixtape.

    Routed through middleware.js, not a rewrite: /motif/mixtape is two segments
    with no dot, which the entry-slug branch would otherwise answer with
    entry.html. The file is named mixtape-index.html so the middleware
    subrequest resolves to it without re-entering that branch.

    Reads motif/data/mixtapes.json, a static manifest the builder regenerates
    on every save and delete — so this page has no runtime dependency on the
    GitHub token and keeps working if it expires.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/motif/motif.css">
  <style>
    .mx-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--hair);
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
      max-width: 560px;
      margin: 0 auto;
      width: 100%;
    }
    .mx-tile {
      background: var(--page-bg);
      padding: 0 0 18px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background 0.25s ease;
    }
    .mx-tile:hover { background: var(--card-bg); }
    .mx-cover {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: var(--card-bg);
    }
    .mx-cover--blank {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .mx-body { padding: 14px 18px 0; }
    .mx-title {
      font-size: 18px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }
    .mx-meta {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .mx-meta .sep { opacity: 0.5; }
    .mx-empty {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 26px;
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="motif-root archive-root" id="mixtape-root"></div>
  <script>
  (function () {
    var root = document.getElementById('mixtape-root');

    fetch('/motif/data/mixtapes.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () { render([]); });

    function render(list) {
      var mast = document.createElement('div');
      mast.className = 'arch-mast';
      mast.innerHTML =
        '<div class="arch-top">' +
          '<a href="/motif" style="display:block"><img class="logo-mark" src="/motif/nm-h-logo.png" alt="nm.h"></a>' +
          '<span>mixtapes · motif</span>' +
        '</div>' +
        '<h1 class="arch-h">Mixtapes.</h1>' +
        '<p class="arch-lede">Played blind. No track list, no idea what is next. Each song turns over a card as it starts.</p>' +
        '<div class="arch-count">' + list.length + (list.length === 1 ? ' mixtape' : ' mixtapes') + '</div>';
      root.appendChild(mast);

      if (!list.length) {
        var e = document.createElement('p');
        e.className = 'mx-empty';
        e.textContent = 'Nothing published yet.';
        root.appendChild(e);
        foot();
        return;
      }

      var grid = document.createElement('div');
      grid.className = 'mx-grid';

      list.forEach(function (m) {
        var a = document.createElement('a');
        a.className = 'mx-tile';
        a.href = '/motif/' + m.slug + '/listen';

        if (m.cover_image_url) {
          var img = document.createElement('img');
          img.className = 'mx-cover';
          img.src = m.cover_image_url;
          img.alt = '';
          img.loading = 'lazy';
          a.appendChild(img);
        } else {
          var blank = document.createElement('div');
          blank.className = 'mx-cover mx-cover--blank';
          blank.textContent = 'no cover';
          a.appendChild(blank);
        }

        var body = document.createElement('div');
        body.className = 'mx-body';

        var t = document.createElement('div');
        t.className = 'mx-title';
        t.textContent = m.title;
        body.appendChild(t);

        var meta = document.createElement('div');
        meta.className = 'mx-meta';
        var bits = [];
        if (m.date) bits.push(m.date);
        // Deliberately no track count — knowing how many songs are coming is
        // its own small spoiler for something played blind.
        bits.push('listen');
        meta.innerHTML = bits.map(function (b, i) {
          return (i ? '<span class="sep">/</span>' : '') + '<span>' + b + '</span>';
        }).join('');
        body.appendChild(meta);

        a.appendChild(body);
        grid.appendChild(a);
      });

      root.appendChild(grid);
      foot();
    }

    function foot() {
      var f = document.createElement('div');
      f.className = 'arch-foot';
      f.innerHTML = '<a href="/motif" style="color:inherit;text-decoration:none">← motif</a><span>/motif/mixtape</span>';
      root.appendChild(f);
    }
  })();
  </script>
</body>
</html>
