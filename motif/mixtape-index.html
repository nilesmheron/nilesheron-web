<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Memorex — mixtapes</title>
<!--
  The shelf the tapes sit on. "Tape" direction, from
  design_handoff_memorex_tape2.

  Reads motif/data/mixtapes.json, a static manifest the builder regenerates on
  every save and delete, so this page has no runtime dependency on the GitHub
  token. Unlisted tapes never reach the manifest.

  Two shapes, one component:
    /motif/mixtape          every tape, newest first
    /motif/by/<handle>      one curator's box

  Routed through middleware.js — /motif/mixtape is two segments and the slug
  branch would otherwise answer it with entry.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/motif/listen.css">
<style>
  /* the shelf, from the handoff — rows are explicit so the shelf line always
     runs the full width: one tape reads as a tape on a shelf with room,
     rather than as a broken grid */
  .shelves { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 24px calc(24px + env(safe-area-inset-bottom, 16px)); }
  .shelf {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
    align-items: end; padding-bottom: 14px; margin-bottom: 22px;
    box-shadow: 0 1px 0 var(--line-2), 0 6px 10px -10px var(--shadow);
  }
  .tape {
    display: block; text-decoration: none; color: inherit; cursor: pointer;
    border-radius: var(--r-slot); overflow: hidden; background: var(--card-bg);
    box-shadow: 0 0 0 1px var(--line-2), 0 8px 16px -12px var(--shadow);
    -webkit-tap-highlight-color: transparent;
  }
  .tape:hover { box-shadow: 0 0 0 1px var(--lit-edge), 0 10px 18px -12px var(--shadow); }
  .tape-art { display: block; background: var(--line); }
  .tape-art img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; filter: var(--past-art); }
  .tape-art--quad { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
  .tape-label {
    padding: 10px 11px 11px; background: var(--label-band);
    display: flex; flex-direction: column; gap: 4px; box-shadow: 0 -1px 0 var(--line);
  }
  .tape-label .t { font-family: var(--serif-display); font-size: 16px; line-height: 1.05; }
  .tape-label .m { font-size: 7px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); }
  .index-foot {
    flex: 0 0 auto; padding: 0 24px calc(20px + env(safe-area-inset-bottom, 16px));
    display: flex; justify-content: space-between;
    font-size: var(--micro); letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute);
  }
  .index-foot a { color: var(--mute); text-decoration: none; }
  .index-foot a:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="listen-root" id="root"></div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('root');

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined && html !== null) n.innerHTML = html;
    return n;
  }
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // /motif/by/<handle> narrows the same shelf to one person's box.
  var m = window.location.pathname.match(/^\/motif\/by\/([a-z0-9-]+)\/?$/);
  var handle = m ? m[1] : null;

  fetch('/motif/data/mixtapes.json')
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(render)
    .catch(function () { render([]); });

  function render(all) {
    var list = handle
      ? all.filter(function (x) { return x.curator && x.curator.handle === handle; })
      : all;

    // Newest first. The manifest sorts by title, so date leads where present.
    list = list.slice().sort(function (a, b) {
      return String(b.date || '').localeCompare(String(a.date || ''));
    });

    var curator = handle && list.length ? list[0].curator : null;

    root.innerHTML = '';

    var head = el('div', 'index-head');
    if (curator) {
      head.appendChild(el('div', 'k', 'Motif · mixtape'));
      var h1 = document.createElement('h1');
      h1.textContent = curator.name || handle;
      head.appendChild(h1);
      head.appendChild(el('div', 'handle', esc(curator.handle)));
      head.appendChild(el('p', null, 'Blind tapes, in order. Nothing is named before it plays.'));
    } else {
      head.appendChild(el('div', 'k', 'Motif'));
      var h2 = document.createElement('h1');
      h2.textContent = 'Mixtape';
      head.appendChild(h2);
      head.appendChild(el('p', null, 'Blind tapes. Songs arrive one at a time and name themselves only once they start.'));
    }
    root.appendChild(head);

    var shelves = el('div', 'shelves');
    if (!list.length) {
      shelves.appendChild(el('p', null,
        '<span style="font-family:var(--serif-body);font-size:14.5px;color:var(--mute)">' +
        (handle ? 'No tapes on this shelf yet.' : 'No mixtapes yet.') + '</span>'));
    }

    for (var r = 0; r < Math.ceil(list.length / 2); r++) {
      var shelf = el('div', 'shelf');
      for (var c = 0; c < 2; c++) {
        var i = r * 2 + c;
        if (i >= list.length) break;
        shelf.appendChild(tile(list[i], Boolean(curator)));
      }
      shelves.appendChild(shelf);
    }
    root.appendChild(shelves);

    var foot = el('div', 'index-foot');
    foot.innerHTML = handle
      ? '<a href="/motif/mixtape">← all mixtapes</a><span>/motif/by/' + esc(handle) + '</span>'
      : '<a href="/motif">← motif</a><span>/motif/mixtape</span>';
    root.appendChild(foot);
  }

  function tile(m2, onCuratorShelf) {
    var a = document.createElement('a');
    a.className = 'tape';
    a.href = '/motif/' + m2.slug + '/listen';

    var art = el('div', 'tape-art');
    if (m2.cover_image_url) {
      var im = document.createElement('img');
      im.src = m2.cover_image_url;
      im.alt = '';
      art.appendChild(im);
    } else {
      art.className = 'tape-art tape-art--quad';
      for (var i = 0; i < 4; i++) art.appendChild(document.createElement('img'));
    }
    a.appendChild(art);

    var lab = el('div', 'tape-label');
    var t = el('div', 't');
    t.textContent = m2.title || m2.slug;
    lab.appendChild(t);

    /* Two facts, never three. On a shelf ordered newest-first the authorship
       earns more than the date — except on a curator's own shelf, where the
       name is redundant and the date takes its place. Track counts stay off
       the tile deliberately. */
    var who = (m2.curator && m2.curator.name) || '';
    var when = m2.date ? String(m2.date) : '';
    var meta = el('div', 'm');
    meta.textContent = 'No. ' + (m2.no || 'T') + (onCuratorShelf
      ? (when ? ' · ' + when : '')
      : (who ? ' · ' + who : ''));
    lab.appendChild(meta);

    a.appendChild(lab);
    return a;
  }
})();
</script>
</body>
</html>
