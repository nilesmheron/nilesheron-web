<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Memorex — mixtapes</title>
<meta name="description" content="Mixtapes played blind. You cannot see what is next — each song names itself only as it starts. A journey, not a list of destinations.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Memorex">
<meta property="og:title" content="Memorex — mixtapes">
<meta property="og:description" content="Mixtapes played blind. You cannot see what is next — each song names itself only as it starts. A journey, not a list of destinations.">
<meta property="og:url" content="https://dev.nilesheron.com/motif/mixtape">
<meta property="og:image" content="https://dev.nilesheron.com/motif/nm-h-logo.png">
<meta name="twitter:card" content="summary">

<!--
  The shelf the tapes sit on. "Tape" direction, from
  design_handoff_memorex_tape2.

  Reads motif/data/mixtapes.json, a static manifest the builder regenerates on
  every save and delete, so this page has no runtime dependency on the GitHub
  token. Unlisted tapes never reach the manifest.

  Two shapes, one component:
    /motif/mixtape          every tape, newest first
    /motif/by/<handle>      one curator's box

  Routed through middleware.js — /motif/mixtape is two segments and the slug
  branch would otherwise answer it with entry.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/motif/listen.css">
<style>
  .index-head { padding: calc(26px + env(safe-area-inset-top, 0px)) 24px 20px; display: flex; flex-direction: column; gap: 9px; flex: 0 0 auto; }
  .index-head .k { font-size: var(--micro); letter-spacing: 0.24em; text-transform: uppercase; color: var(--mute); }
  .index-head h1 { font-family: var(--serif-display); font-size: 36px; line-height: 1; font-weight: 400; margin: 0; }
  .index-head .handle { font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); }
  .index-head p { font-family: var(--serif-body); font-size: 14.5px; line-height: 1.55; color: var(--body); margin: 0; max-width: 30ch; text-wrap: pretty; }
  .index-head p.why { font-size: 13.5px; font-style: italic; color: var(--soft); max-width: 34ch; }

  /* the shelf, from the handoff — rows are explicit so the shelf line always
     runs the full width: one tape reads as a tape on a shelf with room,
     rather than as a broken grid */
  .shelves { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 24px calc(24px + env(safe-area-inset-bottom, 16px)); }
  .shelf {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
    align-items: end; padding-bottom: 14px; margin-bottom: 22px;
    box-shadow: 0 1px 0 var(--line-2), 0 6px 10px -10px var(--shadow);
  }
  .tape {
    display: block; text-decoration: none; color: inherit; cursor: pointer;
    border-radius: var(--r-slot); overflow: hidden; background: var(--card-bg);
    box-shadow: 0 0 0 1px var(--line-2), 0 8px 16px -12px var(--shadow);
    -webkit-tap-highlight-color: transparent;
  }
  .tape:hover { box-shadow: 0 0 0 1px var(--lit-edge), 0 10px 18px -12px var(--shadow); }
  .tape-art { display: block; background: var(--line); }
  .tape-art img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .tape-art--quad { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
  .tape-label {
    padding: 10px 11px 11px; background: var(--label-band);
    display: flex; flex-direction: column; gap: 4px; box-shadow: 0 -1px 0 var(--line);
  }
  .tape-label .t { font-family: var(--serif-display); font-size: 16px; line-height: 1.05; }
  .tape-label .m { font-size: 7px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); }
  .index-foot {
    flex: 0 0 auto; padding: 0 24px calc(20px + env(safe-area-inset-bottom, 16px));
    display: flex; justify-content: space-between;
    font-size: var(--micro); letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute);
  }
  .index-foot a { color: var(--mute); text-decoration: none; }
  .index-foot a:hover { color: var(--ink); }

  /* ============================================================
     WIDE — the shelf is a room, not an object

     listen.css holds the player to a 430px column on a wide screen on
     purpose: a tape player is a small thing you work with one hand, and a
     1600px cassette is not a better cassette. The shelf is the other kind of
     surface. It exists to be browsed, and the same column leaves one tape
     marooned in a half-empty row with a shelf line that stops short of the
     wall.

     So this widens the room and lets the tapes keep their size — the tiles
     are capped rather than stretched, and the row runs the full width
     underneath them, which is what makes a lone tape read as a tape with
     room beside it rather than a broken grid. Row length comes from
     --per-row, set in script so the chunking and the columns can never
     disagree.

     Everything here is inside the media query. Below 560px the shelf is
     byte-for-byte what it was.
     ============================================================ */
  @media (min-width: 560px) {
    /* a long shelf should scroll the page, not a box inside it */
    body { align-items: flex-start; }
    .listen-root {
      max-width: min(1100px, 100%);
      height: auto;
      /* hugs its shelves. Holding the box to the viewport left a short shelf
         sitting above 200px of nothing, which reads as a vacancy rather than
         as room. */
      min-height: 0;
      overflow: visible;
    }
    .shelves { overflow: visible; }
    .index-head, .shelves, .index-foot { padding-left: 34px; padding-right: 34px; }
    .index-head p { max-width: 48ch; }
    .index-head p.why { max-width: 52ch; }

    .shelf {
      grid-template-columns: repeat(var(--per-row, 2), minmax(0, 236px));
      justify-content: start;
      gap: 22px;
      padding-bottom: 18px;
      margin-bottom: 30px;
    }
    .tape-label .t { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="listen-root" id="root"></div>

<script>
(function () {
  'use strict';

  var root = document.getElementById('root');

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined && html !== null) n.innerHTML = html;
    return n;
  }
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // /motif/by/<handle> narrows the same shelf to one person's box.
  var m = window.location.pathname.match(/^\/motif\/by\/([a-z0-9-]+)\/?$/);
  var handle = m ? m[1] : null;

  /* How many tapes stand on one shelf. Rows are built here rather than left
     to the grid to wrap, because the shelf line is drawn on the row — a
     wrapping grid would give one line under the whole block instead of one
     under each shelf. The CSS reads the same number back out of --per-row,
     so the columns and the chunking cannot drift apart. */
  function perRow() {
    var w = window.innerWidth;
    if (w >= 1000) return 4;
    if (w >= 760) return 3;
    return 2;
  }

  var shown = [];
  var shownPerRow = 0;

  fetch('/motif/data/mixtapes.json')
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(render)
    .catch(function () { render([]); });

  /* Re-render only when the shelf actually changes length. A resize that does
     not cross a breakpoint costs nothing, and on a phone this never fires. */
  window.addEventListener('resize', function () {
    if (perRow() !== shownPerRow) render(shown);
  });

  function render(all) {
    shown = all;
    var list = handle
      ? all.filter(function (x) { return x.curator && x.curator.handle === handle; })
      : all;

    // Newest first. The manifest sorts by title, so date leads where present.
    list = list.slice().sort(function (a, b) {
      return String(b.date || '').localeCompare(String(a.date || ''));
    });

    var curator = handle && list.length ? list[0].curator : null;

    root.innerHTML = '';

    var head = el('div', 'index-head');
    if (curator) {
      head.appendChild(el('div', 'k', 'Motif · mixtape'));
      var h1 = document.createElement('h1');
      h1.textContent = curator.name || handle;
      head.appendChild(h1);
      head.appendChild(el('div', 'handle', esc(curator.handle)));
      head.appendChild(el('p', null, 'Tapes by ' + esc(curator.name || handle) + ', played blind. Nothing is named before it plays.'));
      head.appendChild(el('p', 'why', 'A journey, not a list of destinations.'));
    } else {
      head.appendChild(el('div', 'k', 'Motif'));
      var h2 = document.createElement('h1');
      h2.textContent = 'Mixtape';
      head.appendChild(h2);
      /* The shelf is the front door for anyone who has not been sent a link,
         so it carries the reason as well as the rule. */
      head.appendChild(el('p', null, 'Tapes you play without knowing what is next. Each song names itself only as it starts.'));
      head.appendChild(el('p', 'why', 'A mixtape was a journey, not a list of destinations. These are built to feel like that again.'));
    }
    root.appendChild(head);

    var shelves = el('div', 'shelves');
    if (!list.length) {
      shelves.appendChild(el('p', null,
        '<span style="font-family:var(--serif-body);font-size:14.5px;color:var(--mute)">' +
        (handle ? 'No tapes on this shelf yet.' : 'No mixtapes yet.') + '</span>'));
    }

    var n = perRow();
    shownPerRow = n;
    root.style.setProperty('--per-row', String(n));

    for (var r = 0; r < Math.ceil(list.length / n); r++) {
      var shelf = el('div', 'shelf');
      for (var c = 0; c < n; c++) {
        var i = r * n + c;
        if (i >= list.length) break;
        shelf.appendChild(tile(list[i], Boolean(curator)));
      }
      shelves.appendChild(shelf);
    }
    root.appendChild(shelves);

    var foot = el('div', 'index-foot');
    foot.innerHTML = handle
      ? '<a href="/motif/mixtape">← all mixtapes</a><span>/motif/by/' + esc(handle) + '</span>'
      : '<a href="/motif">← motif</a><span>/motif/mixtape</span>';
    root.appendChild(foot);
  }

  function tile(m2, onCuratorShelf) {
    var a = document.createElement('a');
    a.className = 'tape';
    a.href = '/motif/' + m2.slug + '/listen';

    var art = el('div', 'tape-art');
    if (m2.cover_image_url) {
      var im = document.createElement('img');
      im.src = m2.cover_image_url;
      im.alt = '';
      art.appendChild(im);
    } else {
      art.className = 'tape-art tape-art--quad';
      for (var i = 0; i < 4; i++) art.appendChild(document.createElement('img'));
    }
    a.appendChild(art);

    var lab = el('div', 'tape-label');
    var t = el('div', 't');
    t.textContent = m2.title || m2.slug;
    lab.appendChild(t);

    /* Two facts, never three. On a shelf ordered newest-first the authorship
       earns more than the date — except on a curator's own shelf, where the
       name is redundant and the date takes its place. Track counts stay off
       the tile deliberately. */
    var who = (m2.curator && m2.curator.name) || '';
    var when = m2.date ? String(m2.date) : '';
    var meta = el('div', 'm');
    meta.textContent = 'No. ' + (m2.no || 'T') + (onCuratorShelf
      ? (when ? ' · ' + when : '')
      : (who ? ' · ' + who : ''));
    lab.appendChild(meta);

    a.appendChild(lab);
    return a;
  }
})();
</script>
</body>
</html>
