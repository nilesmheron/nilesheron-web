<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Motif spike — Path A / Spotify</title>
<!--
  THROWAWAY instrument panel for the Motif blind-playlist spike (PRD §9.2).
  Not a product surface. Delete this directory, api/motif-spike-auth.js and
  api/motif-spike-callback.js once the platform decision is recorded.

  Filename note: this is spotify.html, not index.html, on purpose. /motif/spike
  would be a two-segment path with no dot, which middleware.js:39 treats as an
  entry slug and answers with entry.html. Three segments falls through to static.

  The Spotify Web Playback SDK is loaded from Spotify's official CDN, authorized
  for spike and player pages only by PRD §9.3.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px 14px calc(24px + env(safe-area-inset-bottom, 0px));
    background: #16151a;
    color: #e6e3dc;
    font: 13px/1.5 "SF Mono", Menlo, ui-monospace, monospace;
  }
  h1 { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #b5793e; margin: 0 0 2px; }
  .sub { color: #7d7970; font-size: 11px; margin-bottom: 16px; }
  .panel { border: 1px solid #2e2c34; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
  .panel h2 { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #7d7970; margin: 0 0 10px; font-weight: 400; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .row .k { color: #7d7970; }
  .row .v { text-align: right; word-break: break-word; }
  .ok { color: #6fbf73; }
  .bad { color: #e0625f; }
  .warn { color: #d8a24a; }
  button {
    display: block; width: 100%; margin: 6px 0; padding: 13px 12px;
    background: #22212a; color: #e6e3dc; border: 1px solid #3a3843;
    border-radius: 7px; font: inherit; text-align: left; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: 0.38; }
  button.primary { background: #b5793e; border-color: #b5793e; color: #16151a; font-weight: 600; }
  button .hint { display: block; color: #7d7970; font-size: 11px; margin-top: 3px; font-weight: 400; }
  button.primary .hint { color: #3d2a15; }
  .modes { display: flex; gap: 8px; margin: 6px 0 2px; }
  .modes button { margin: 0; text-align: center; }
  .modes button[aria-pressed="true"] { border-color: #b5793e; color: #b5793e; }
  #log { max-height: 46vh; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
  #log li { padding: 3px 0; border-bottom: 1px solid #232128; font-size: 11.5px; display: flex; gap: 8px; }
  #log li:last-child { border-bottom: 0; }
  #log .t { color: #56535c; flex: 0 0 52px; }
  #log .m { flex: 1 1 auto; word-break: break-word; }
  .verdict { background: #201f28; border-left: 2px solid #b5793e; padding: 8px 10px; margin: 8px 0; font-size: 11.5px; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>Motif spike</h1>
<div class="sub">Path A — Spotify Web Playback SDK. PRD §9.2 checks 1–5.</div>

<div class="panel">
  <h2>State</h2>
  <div class="row"><span class="k">auth</span><span class="v" id="s-auth">checking…</span></div>
  <div class="row"><span class="k">account</span><span class="v" id="s-account">—</span></div>
  <div class="row"><span class="k">sdk</span><span class="v" id="s-sdk">not loaded</span></div>
  <div class="row"><span class="k">device</span><span class="v" id="s-device">—</span></div>
  <div class="row"><span class="k">playlist</span><span class="v" id="s-playlist">—</span></div>
  <div class="row"><span class="k">track</span><span class="v" id="s-track">—</span></div>
  <div class="row"><span class="k">position</span><span class="v" id="s-pos">—</span></div>
  <div class="row"><span class="k">wake lock</span><span class="v" id="s-wake">—</span></div>
  <div class="row"><span class="k">media session</span><span class="v" id="s-media">—</span></div>
</div>

<div class="panel">
  <h2>Run</h2>
  <button id="b-connect" class="primary">Connect Spotify
    <span class="hint">check 1 — OAuth, then come back here</span></button>

  <div class="modes">
    <button id="b-mode-blind" aria-pressed="true">blind</button>
    <button id="b-mode-queue" aria-pressed="false">queue×2</button>
    <button id="b-mode-auto" aria-pressed="false">auto-queue</button>
  </div>
  <div class="sub" id="mode-hint" style="margin:4px 0 10px">blind: one URI at a time, our JS starts the next track. This is the product.</div>

  <button id="b-play" disabled>1 · Play<span class="hint">check 1 — must be a real tap (iOS needs the gesture)</span></button>
  <button id="b-seek" disabled>2 · Jump to 20s before end<span class="hint">sets up the transition test without waiting out the song</span></button>
  <button id="b-next" disabled>skip forward</button>
  <button id="b-prev" disabled>skip back</button>
  <button id="b-pause" disabled>pause / resume</button>
  <button id="b-wake" disabled>3 · Request screen wake lock</button>
  <button id="b-append" disabled>Append one track to the queue now
    <span class="hint">tests POST /me/player/queue on its own</span></button>
  <button id="b-autoseek" aria-pressed="false">Auto-seek: OFF
    <span class="hint">jump every track to 20s before its end — 8 songs in ~3 min</span></button>
  <button id="b-copy">Copy log</button>
  <button id="b-logout">Disconnect Spotify</button>
</div>

<div class="panel">
  <h2>Log</h2>
  <div id="verdicts"></div>
  <ul id="log"></ul>
</div>

<script>
(function () {
  'use strict';

  // Playlist behind motif/data/familiar-fruit.json → spotify_url.
  // Override with ?playlist=<id or open.spotify.com URL> to point at another one.
  var DEFAULT_PLAYLIST = '4lnUuG0kxLO25YooXSv2T0';
  // Spotify refuses playlist contents to this app (403 on /playlists/{id}/tracks
  // even for public playlists). /v1/search still works, so it is the fallback.
  var FALLBACK_QUERY = 'artist:Tobe Nwigwe';
  // Fixed order so every run is identical and the tester knows what should come
  // next by ear. Hydrated through /v1/tracks, which returns them in this order.
  var FIXED_TRACK_IDS = [
    '7LbPtmXDn5j9pWosFnX5vh', // 0. Fire         · SiR                    153s
    '6DeYDFBS41W8IbJW9UNkRt', // 1. Sweet Thing  · Cleo Sol               377s
    '7yvzMIqwbGRMjqBriuUUmm', // 2. Reign        · 2 Chainz, Cash Cobain  185s
    '08CMPHgVZWm0NNBw0uoCP7', // 3. SO GOOD      · Shay Lia, KAYTRANADA   222s
    '7oF2WD5RByyNQQmmI5a283', // 4. There U Go   · Johnny Gill            316s
    '6alE6gRmLe3kOA3uNcdt5a', // 5. Just My Type · Blxst                  160s
    '2AvfSSr0Wazcs643jYBzoO', // 6. On Demand    · Imani Imani            161s
    '0kjm5DAzDidQhHgElDrdfq'  // 7. Rain         · Sunday Service Choir   287s
  ];
  var AUTH = '/api/motif-spike-auth';

  var t0 = Date.now();
  var player = null;
  var deviceId = null;
  var tracks = [];
  var idx = 0;
  var mode = 'blind';
  var lastState = null;
  var prevState = null;
  var endedFor = null;      // uri we've already handled an end for
  var mediaFor = null;      // uri the lock-screen metadata currently describes
  var audibleVerdictShown = false;
  var queuedUpTo = -1;      // highest track index handed to Spotify
  var autoSeek = false;
  var wakeLock = null;
  var bg = null;            // snapshot taken when the page goes hidden
  var activated = false;

  var $ = function (id) { return document.getElementById(id); };

  function log(msg, cls) {
    var li = document.createElement('li');
    var t = document.createElement('span');
    t.className = 't';
    t.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's';
    var m = document.createElement('span');
    m.className = 'm' + (cls ? ' ' + cls : '');
    m.textContent = msg;
    li.appendChild(t); li.appendChild(m);
    $('log').appendChild(li);
    $('log').scrollTop = $('log').scrollHeight;
  }

  var seenVerdicts = {};
  function verdict(text) {
    // repeating the same verdict buries the ones that differ
    var key = text.split('\n')[0];
    if (seenVerdicts[key]) { seenVerdicts[key]++; return; }
    seenVerdicts[key] = 1;
    var d = document.createElement('div');
    d.className = 'verdict';
    d.textContent = text;
    $('verdicts').appendChild(d);
    log('VERDICT recorded — see box above', 'warn');
  }

  function set(id, text, cls) {
    var el = $(id);
    el.textContent = text;
    el.className = 'v' + (cls ? ' ' + cls : '');
  }

  function secs(ms) { return (ms / 1000).toFixed(1) + 's'; }

  /* ---------- token ---------- */

  var tokenCache = { value: null, expiresAt: 0 };

  function getToken() {
    if (tokenCache.value && Date.now() < tokenCache.expiresAt - 30000) {
      return Promise.resolve(tokenCache.value);
    }
    return fetch(AUTH + '?action=token', { credentials: 'same-origin' })
      .then(function (r) {
        if (r.status === 401) { throw new Error('not_authenticated'); }
        if (!r.ok) { throw new Error('token http ' + r.status); }
        return r.json();
      })
      .then(function (d) {
        tokenCache.value = d.access_token;
        tokenCache.expiresAt = Date.now() + (d.expires_in || 3600) * 1000;
        return d.access_token;
      });
  }

  function api(path, opts) {
    return getToken().then(function (tok) {
      var o = opts || {};
      return fetch('https://api.spotify.com/v1' + path, {
        method: o.method || 'GET',
        headers: {
          Authorization: 'Bearer ' + tok,
          'Content-Type': 'application/json'
        },
        body: o.body ? JSON.stringify(o.body) : undefined
      });
    });
  }

  /* ---------- boot ---------- */

  var params = new URLSearchParams(location.search);
  if (params.get('auth')) {
    var a = params.get('auth');
    log('returned from OAuth: ' + a + (params.get('reason') ? ' (' + params.get('reason') + ')' : ''),
        a === 'ok' ? 'ok' : 'bad');
    history.replaceState({}, '', location.pathname);
  }

  set('s-media', 'mediaSession' in navigator ? 'available' : 'MISSING', 'mediaSession' in navigator ? 'ok' : 'bad');
  set('s-wake', 'wakeLock' in navigator ? 'available' : 'MISSING', 'wakeLock' in navigator ? '' : 'bad');
  log('ua: ' + navigator.userAgent);

  fetch(AUTH + '?action=status', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.authenticated) {
        set('s-auth', 'authenticated', 'ok');
        $('b-connect').textContent = 'Re-connect Spotify';
        $('b-connect').className = '';
        checkAccount();
        loadTracks();
        loadSdk();
      } else {
        set('s-auth', 'not connected', 'warn');
        log('tap "Connect Spotify" to start');
      }
    })
    .catch(function (e) {
      set('s-auth', 'status check failed', 'bad');
      log('status check failed: ' + e.message, 'bad');
    });

  /* ---------- account tier ----------
     The single most common cause of silent playback failure: the Web Playback
     SDK requires full Premium and excludes mobile-only Premium tiers. Ask
     Spotify directly rather than inferring it from a failed play call. */

  function checkAccount() {
    api('/me').then(function (r) {
      if (!r.ok) { set('s-account', 'lookup failed http ' + r.status, 'bad'); return; }
      return r.json().then(function (me) {
        var product = me.product || 'unknown';
        var premium = product === 'premium';
        set('s-account', product + (me.country ? ' · ' + me.country : ''), premium ? 'ok' : 'bad');
        log('account: ' + product + ' (' + (me.display_name || me.id) + ')', premium ? 'ok' : 'bad');
        if (!premium) {
          verdict('CHECK 1 FAIL — this Spotify account reports product "' + product + '".\n' +
                  'The Web Playback SDK requires full Premium. Playback calls will be\n' +
                  'accepted or rejected with no audio. Path A cannot be tested on this account.');
        }
      });
    }).catch(function (e) {
      set('s-account', 'lookup failed', 'bad');
      log('account lookup failed: ' + e.message, 'bad');
    });
  }

  /* ---------- playlist ---------- */

  function playlistId() {
    var raw = params.get('playlist');
    if (!raw) return DEFAULT_PLAYLIST;
    var m = raw.match(/playlist\/([A-Za-z0-9]+)/);
    return m ? m[1] : raw.split('?')[0];
  }

  function usable(list) {
    return (list || []).filter(function (t) { return t && t.uri && t.duration_ms; });
  }

  // Try the real playlist first — a user token may have access this app's
  // client-credentials token does not. Fall back to search so a blocked
  // playlist never blocks the actual experiment.
  // Fixed list is the default so runs are reproducible. ?source=playlist opts
  // back into reading the real entry playlist, if Spotify ever allows it again.
  function loadTracks() {
    if (params.get('source') === 'playlist') return loadPlaylist();
    // GET /v1/tracks?ids= is 403 for this app, same restriction as playlists.
    // GET /v1/tracks/{id} still works, so fetch them one at a time and keep order.
    return Promise.all(FIXED_TRACK_IDS.map(function (id) {
      return api('/tracks/' + id)
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    })).then(function (results) {
      var missing = [];
      results.forEach(function (t, i) { if (!t) missing.push(FIXED_TRACK_IDS[i]); });
      tracks = usable(results);
      if (!tracks.length) {
        set('s-playlist', 'fixed list failed', 'bad');
        verdict('FIXED TRACK LIST FAILED TO LOAD — every /v1/tracks/{id} call failed.\n' +
                'Not falling back to search: a silent fallback is what made the last run\n' +
                'play the wrong songs. Fix this before running anything else.');
        return;
      }
      if (missing.length) {
        log(missing.length + ' track(s) failed to load: ' + missing.join(', '), 'bad');
      }
      set('s-playlist', tracks.length + ' tracks (fixed)', missing.length ? 'warn' : 'ok');
      log('fixed list loaded, same order every run:', 'ok');
      tracks.forEach(function (t, i) {
        log('  [' + i + '] ' + t.name + ' · ' + t.artists[0].name + ' · ' + Math.round(t.duration_ms / 1000) + 's');
      });
    });
  }

  function loadPlaylist() {
    var id = playlistId();
    var fields = 'items(track(uri,name,duration_ms,artists(name),album(name,images)))';
    api('/playlists/' + id + '/tracks?limit=20&fields=' + encodeURIComponent(fields))
      .then(function (r) {
        if (!r.ok) {
          log('playlist tracks refused: http ' + r.status + ' — falling back to search', 'warn');
          return null;
        }
        return r.json();
      })
      .then(function (d) {
        if (!d) return loadFromSearch();
        tracks = usable((d.items || []).map(function (i) { return i.track; }));
        if (!tracks.length) {
          log('playlist returned no usable tracks — falling back to search', 'warn');
          return loadFromSearch();
        }
        set('s-playlist', tracks.length + ' tracks (playlist)', 'ok');
        log('playlist loaded: ' + tracks.length + ' tracks from ' + id, 'ok');
      })
      .catch(function (e) {
        log('playlist load errored: ' + e.message + ' — falling back to search', 'warn');
        return loadFromSearch();
      });
  }

  function loadFromSearch() {
    return api('/search?type=track&limit=10&q=' + encodeURIComponent(FALLBACK_QUERY))
      .then(function (r) {
        if (!r.ok) { throw new Error('search http ' + r.status); }
        return r.json();
      })
      .then(function (d) {
        tracks = usable(((d.tracks || {}).items) || []);
        set('s-playlist', tracks.length + ' tracks (search)', tracks.length ? 'warn' : 'bad');
        if (tracks.length) {
          log('fallback: ' + tracks.length + ' tracks via search "' + FALLBACK_QUERY + '"', 'ok');
          log('these are stand-ins — the experiment is about playback, not this playlist');
        } else {
          log('search returned nothing usable', 'bad');
        }
      })
      .catch(function (e) {
        set('s-playlist', 'failed', 'bad');
        log('search fallback failed: ' + e.message, 'bad');
        verdict('CANNOT RUN — no track URIs from either the playlist or search.\nNothing downstream of this can be tested.');
      });
  }

  /* ---------- sdk ---------- */

  function loadSdk() {
    set('s-sdk', 'loading…');
    var s = document.createElement('script');
    s.src = 'https://sdk.scdn.co/spotify-player.js';
    s.onerror = function () { set('s-sdk', 'CDN load failed', 'bad'); log('SDK script failed to load', 'bad'); };
    document.head.appendChild(s);
  }

  window.onSpotifyWebPlaybackSDKReady = function () {
    set('s-sdk', 'script ready');
    log('SDK script ready, connecting player');

    player = new Spotify.Player({
      name: 'Motif spike',
      getOAuthToken: function (cb) {
        getToken().then(cb).catch(function (e) {
          log('getOAuthToken failed: ' + e.message, 'bad');
        });
      },
      volume: 0.8
    });

    player.addListener('ready', function (d) {
      deviceId = d.device_id;
      set('s-sdk', 'connected', 'ok');
      set('s-device', d.device_id.slice(0, 12) + '…', 'ok');
      log('player ready, device ' + d.device_id);
      ['b-play', 'b-seek', 'b-next', 'b-prev', 'b-pause', 'b-wake', 'b-append'].forEach(function (id) {
        $(id).disabled = false;
      });
    });

    player.addListener('not_ready', function (d) {
      set('s-sdk', 'device went offline', 'bad');
      log('not_ready: device ' + d.device_id + ' offline', 'bad');
    });

    ['initialization_error', 'authentication_error', 'account_error', 'playback_error'].forEach(function (ev) {
      player.addListener(ev, function (e) {
        log(ev + ': ' + e.message, 'bad');
        if (ev === 'account_error') {
          verdict('CHECK 1 FAIL — account_error. The Web Playback SDK requires full Spotify Premium; mobile-only Premium tiers are excluded.');
        }
      });
    });

    player.addListener('autoplay_failed', function () {
      log('autoplay_failed — playback needs a user gesture', 'warn');
    });

    player.addListener('player_state_changed', onStateChange);

    player.connect().then(function (ok) {
      log(ok ? 'player.connect() ok' : 'player.connect() refused', ok ? '' : 'bad');
    });
  };

  function onStateChange(state) {
    if (!state) { log('state → null (playback moved to another device)', 'warn'); return; }
    prevState = lastState;
    lastState = state;

    var cur = state.track_window && state.track_window.current_track;
    if (cur) {
      set('s-track', cur.name + ' — ' + cur.artists.map(function (a) { return a.name; }).join(', '));
      // only rebuild metadata on an actual track change — the ticker runs every second
      if (cur.uri !== mediaFor) {
        mediaFor = cur.uri;
        setMediaSession(cur);
        onTrackStarted(cur, state);
      }
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = state.paused ? 'paused' : 'playing';
      }
    }
    set('s-pos', secs(state.position) + ' / ' + secs(state.duration) + (state.paused ? ' (paused)' : ''));

    if (looksEnded(state, prevState)) {
      var uri = cur ? cur.uri : 'unknown';
      if (endedFor !== uri) {
        endedFor = uri;
        log('TRACK ENDED (' + (document.visibilityState) + ')', 'ok');
        onTrackEnded();
      }
    }
  }

  // With a single URI and no context, Spotify parks the player at position 0,
  // paused, when the track finishes. Require that we were mid-track just before
  // so a fresh load or a manual pause doesn't read as an ending.
  function looksEnded(state, prev) {
    if (!state.paused || state.position !== 0) return false;
    var r = state.restrictions || {};
    var reasons = r.disallow_resuming_reasons || [];
    if (reasons.indexOf('not_paused') !== -1) return true;
    return Boolean(prev && !prev.paused && prev.position > 0);
  }

  // Fires whenever the playing track changes, however it changed — our dispatch,
  // Spotify advancing the queue, or the listener hitting next on the lock screen.
  // This is where the real player would reveal the card.
  function onTrackStarted(cur, state) {
    var known = indexOfUri(cur.uri);
    if (known > -1) idx = known;
    log('NOW PLAYING (' + document.visibilityState + '): ' + cur.name + (known > -1 ? ' [' + known + ']' : ' [not in list]'));
    if (mode === 'autoqueue') {
      appendNext('track started');
    }
    // Let playback settle before seeking, so the seek can't race the track load.
    if (autoSeek && state && state.duration > 30000) {
      setTimeout(function () {
        if (!player) return;
        player.seek(state.duration - 20000).then(function () {
          log('auto-seek → 20s before end of ' + cur.name);
        });
      }, 2500);
    }
  }

  function onTrackEnded() {
    if (mode !== 'blind') {
      log('native queue mode — Spotify advances on its own, no dispatch from us');
      return;
    }
    if (idx + 1 >= tracks.length) { log('end of playlist'); return; }
    idx += 1;
    log('dispatching next track from JS → ' + tracks[idx].name);
    playCurrent();
  }

  /* ---------- playback ---------- */

  function playCurrent() {
    // These used to bail silently, which looked exactly like "play does nothing".
    if (!deviceId) {
      log('CANNOT PLAY — no SDK device yet. The player never reached "ready".', 'bad');
      return Promise.resolve();
    }
    if (!tracks.length) {
      log('CANNOT PLAY — track list is empty. The playlist fetch failed; see above.', 'bad');
      return Promise.resolve();
    }
    // blind: hand Spotify exactly one URI so its queue never learns what's next.
    // native queue: hand it this track and the following one, to isolate whether
    // a failed transition is our JS dying or the audio pipeline dying.
    // Spotify plays QUEUED tracks before the remainder of the CONTEXT. Seeding
    // the context with two and then appending a third makes the appended track
    // cut in front of the second, stranding it until the queue drains — observed
    // 2026-09-09, Sweet Thing landing 7th. So auto-queue seeds ONE track and
    // keeps exactly one queued ahead; the context never has leftovers to strand.
    var uris = (mode === 'queue')
      ? tracks.slice(idx, idx + 2).map(function (t) { return t.uri; })
      : [tracks[idx].uri];
    endedFor = null;
    queuedUpTo = (mode === 'queue') ? Math.min(idx + 1, tracks.length - 1) : idx;
    return api('/me/player/play?device_id=' + deviceId, { method: 'PUT', body: { uris: uris } })
      .then(function (r) {
        if (!r.ok) {
          return r.text().then(function (b) {
            log('play failed http ' + r.status + ' ' + b.slice(0, 160), 'bad');
            if (r.status === 403) {
              verdict('CHECK 1 FAIL — 403 from /me/player/play. Usually a non-Premium account or a Premium tier the SDK excludes.');
            }
            if (r.status === 404) {
              verdict('DEVICE LOST — 404 from /me/player/play. Spotify no longer sees our SDK\n' +
                      'device. Observed after a few minutes with the phone locked. Attempting\n' +
                      'an automatic reconnect; if that fails the page needs a reload.');
              reconnectDevice();
            }
          });
        }
        log('play accepted (http ' + r.status + ') → ' + tracks[idx].name, 'ok');
        confirmAudioMoving();
      });
  }

  /* ---------- queue top-up ----------
     The question the build hangs on: can we extend the queue WITHOUT issuing a
     new play call? A new play call starts a new media source, which iOS refuses
     to autoplay while locked. POST /me/player/queue should append to the
     existing context instead, leaving the already-activated audio element alone. */

  function appendNext(reason) {
    if (!deviceId) { log('append skipped — no device', 'warn'); return Promise.resolve(false); }
    var n = queuedUpTo + 1;
    if (n >= tracks.length) {
      // Nothing left to queue. When the last track ends Spotify falls back to the
      // seed context and replays it — the real player must catch this and enter
      // the §5.3 completion state instead of looping.
      log('END OF LIST — nothing left to queue. Next boundary will replay the seed track.', 'warn');
      return Promise.resolve(false);
    }
    var t = tracks[n];
    return api('/me/player/queue?device_id=' + deviceId + '&uri=' + encodeURIComponent(t.uri), { method: 'POST' })
      .then(function (r) {
        if (!r.ok) {
          return r.text().then(function (b) {
            log('APPEND FAILED http ' + r.status + ' ' + b.slice(0, 140), 'bad');
            verdict('QUEUE TOP-UP FAILED — POST /me/player/queue returned ' + r.status + '.\n' +
                    'The queue cannot be extended without a new play call, which iOS will\n' +
                    'not autoplay while locked. Fall back to queueing a small N ahead in\n' +
                    'one play call, per the 2026-09-09 decision.');
            return false;
          });
        }
        queuedUpTo = n;
        log('appended (' + reason + ') → ' + t.name + ' · queued through ' + n, 'ok');
        return true;
      });
  }

  $('b-append').addEventListener('click', function () { appendNext('manual'); });

  $('b-autoseek').addEventListener('click', function () {
    autoSeek = !autoSeek;
    $('b-autoseek').setAttribute('aria-pressed', String(autoSeek));
    $('b-autoseek').firstChild.nodeValue = 'Auto-seek: ' + (autoSeek ? 'ON' : 'OFF');
    log('auto-seek ' + (autoSeek ? 'ON — each track jumps to 20s before its end' : 'OFF'), 'warn');
  });

  // The SDK device disappears from Spotify Connect after the phone sits locked
  // for a few minutes. Try to bring it back rather than dead-ending on 404s.
  var reconnecting = false;
  function reconnectDevice() {
    if (reconnecting || !player) return;
    reconnecting = true;
    log('reconnecting SDK device…', 'warn');
    player.connect().then(function (ok) {
      reconnecting = false;
      log(ok ? 'reconnect returned ok — waiting for a new "ready"' : 'reconnect refused', ok ? 'ok' : 'bad');
    }).catch(function (e) {
      reconnecting = false;
      log('reconnect threw: ' + e.message, 'bad');
    });
  }

  // Spotify answers /play with 204 the moment it accepts the command — that is
  // not the same as audio coming out. Verify the position is actually advancing,
  // so "accepted but silent" is distinguishable from "never started".
  function confirmAudioMoving() {
    var startedAt = Date.now();
    setTimeout(function () {
      if (!player) return;
      player.getCurrentState().then(function (s) {
        if (!s) {
          log('4s after play: no player state — playback is on another device, or the SDK lost it', 'bad');
          return;
        }
        if (s.paused) {
          log('4s after play: player is PAUSED at ' + secs(s.position), 'bad');
          if (document.visibilityState === 'hidden') {
            verdict('TRANSITION LOADED BUT DID NOT AUTOPLAY.\n' +
                    'The next track was accepted and loaded while the phone was locked,\n' +
                    'then sat paused. iOS requires a user activation to start a NEW media\n' +
                    'source; the first track inherited one from the Play tap, this one had\n' +
                    'none. This is the blocker for locked-screen listening — not JS being\n' +
                    'suspended, which demonstrably still ran.');
          }
          return;
        }
        if (s.position > 1000) {
          log('4s after play: position advancing (' + secs(s.position) + ') — audio IS running', 'ok');
          // once is informative; on every track it buries the results that matter
          if (!audibleVerdictShown) {
            audibleVerdictShown = true;
            verdict('CHECK 1 PASS — playback is running.\n' +
                    'If you hear nothing it is output, not playback: the mute switch on the\n' +
                    'side of the iPhone, the volume, or audio routed to another device.');
          }
        } else {
          log('4s after play: position stuck at ' + secs(s.position) + ' — accepted but not advancing', 'bad');
        }
      });
    }, 4000);
    return startedAt;
  }

  $('b-play').addEventListener('click', function () {
    // iOS: the audio element has to be unlocked inside a real user gesture,
    // synchronously, before any playback call.
    if (!activated && player && player.activateElement) {
      try { player.activateElement(); activated = true; log('activateElement() called (iOS audio unlock)'); }
      catch (e) { log('activateElement() threw: ' + e.message, 'warn'); }
    }
    playCurrent();
  });

  $('b-seek').addEventListener('click', function () {
    if (!lastState) { log('no state yet — press play first', 'warn'); return; }
    var target = Math.max(0, lastState.duration - 20000);
    player.seek(target).then(function () {
      log('seeked to ' + secs(target) + ' (20s before end)');
      log('NOW: swipe up to the home screen and stay out of Safari 45s', 'warn');
      log('locking the screen is a different test and will not measure this', 'warn');
    });
  });

  $('b-next').addEventListener('click', function () {
    if (idx + 1 >= tracks.length) { log('already on the last track', 'warn'); return; }
    idx += 1; playCurrent();
  });

  $('b-prev').addEventListener('click', function () {
    if (idx === 0) { log('already on the first track', 'warn'); return; }
    idx -= 1; playCurrent();
  });

  $('b-pause').addEventListener('click', function () {
    player.togglePlay().then(function () { log('togglePlay()'); });
  });

  /* ---------- mode ---------- */

  var MODE_HINTS = {
    blind: 'blind: one URI at a time, our JS starts the next track. Fails when locked.',
    queue: 'queue×2: two URIs in one play call. Works locked, but stops after the second song.',
    autoqueue: 'auto-queue: start with two, append one more each time a track begins. THE CANDIDATE DESIGN.'
  };

  function setMode(m) {
    mode = m;
    $('b-mode-blind').setAttribute('aria-pressed', String(m === 'blind'));
    $('b-mode-queue').setAttribute('aria-pressed', String(m === 'queue'));
    $('b-mode-auto').setAttribute('aria-pressed', String(m === 'autoqueue'));
    $('mode-hint').textContent = MODE_HINTS[m];
    log('mode → ' + m);
    // Switching the toggle only affects the NEXT play call. Without re-issuing,
    // the old single-URI context stays loaded and the test measures nothing —
    // which is exactly how the 2026-09-08 native-queue run came out void.
    if (lastState && !lastState.paused) {
      log('restarting playback so the new mode actually applies', 'warn');
      playCurrent();
    } else {
      log('tap "1 · Play" to load the queue in this mode', 'warn');
    }
  }
  $('b-mode-blind').addEventListener('click', function () { setMode('blind'); });
  $('b-mode-queue').addEventListener('click', function () { setMode('queue'); });
  $('b-mode-auto').addEventListener('click', function () { setMode('autoqueue'); });

  /* ---------- check 3: wake lock ---------- */

  function requestWakeLock() {
    if (!('wakeLock' in navigator)) { set('s-wake', 'unsupported', 'bad'); return; }
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      set('s-wake', 'held', 'ok');
      log('wake lock acquired', 'ok');
      lock.addEventListener('release', function () {
        set('s-wake', 'released', 'warn');
        log('wake lock released', 'warn');
      });
    }).catch(function (e) {
      set('s-wake', 'denied', 'bad');
      log('wake lock request failed: ' + e.name + ' ' + e.message, 'bad');
    });
  }
  $('b-wake').addEventListener('click', requestWakeLock);

  /* ---------- check 4: media session ---------- */

  function setMediaSession(track) {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.name,
        artist: track.artists.map(function (a) { return a.name; }).join(', '),
        album: (track.album && track.album.name) || 'Motif',
        artwork: ((track.album && track.album.images) || []).map(function (i) {
          return { src: i.url, sizes: i.width + 'x' + i.height, type: 'image/jpeg' };
        })
      });
      navigator.mediaSession.playbackState = lastState && lastState.paused ? 'paused' : 'playing';
      set('s-media', 'metadata set', 'ok');
    } catch (e) {
      set('s-media', 'failed', 'bad');
      log('mediaSession failed: ' + e.message, 'bad');
    }
  }

  if ('mediaSession' in navigator) {
    var handlers = {
      play: function () { player && player.resume(); log('lock-screen: play'); },
      pause: function () { player && player.pause(); log('lock-screen: pause'); },
      nexttrack: function () { $('b-next').click(); log('lock-screen: next'); },
      previoustrack: function () { $('b-prev').click(); log('lock-screen: previous'); }
    };
    Object.keys(handlers).forEach(function (k) {
      try { navigator.mediaSession.setActionHandler(k, handlers[k]); }
      catch (e) { log('mediaSession handler "' + k + '" unsupported', 'warn'); }
    });
  }

  /* ---------- checks 2 + 5: background survival ---------- */

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      var cur = lastState && lastState.track_window && lastState.track_window.current_track;
      bg = {
        at: Date.now(),
        uri: cur ? cur.uri : null,
        name: cur ? cur.name : '—',
        pos: lastState ? lastState.position : 0,
        dur: lastState ? lastState.duration : 0,
        idx: idx,
        paused: lastState ? lastState.paused : true,
        mode: mode
      };
      log('→ backgrounded at ' + secs(bg.pos) + ' of "' + bg.name + '"');
      return;
    }

    log('← foregrounded');
    if (wakeLock === null && 'wakeLock' in navigator) {
      // the platform drops the lock on hide; re-take it so check 3 stays honest
      requestWakeLock();
    }
    if (!bg) return;
    measureBackground(bg);
    bg = null;
  });

  function measureBackground(snap) {
    var away = Date.now() - snap.at;

    // Ask Spotify's servers rather than the local SDK — local state can be stale
    // for a moment after resume, and this is the number the decision rests on.
    api('/me/player').then(function (r) {
      if (r.status === 204) {
        verdict(report(snap, away, null, false, 'no active playback on return'));
        return;
      }
      if (!r.ok) { log('player state fetch http ' + r.status, 'bad'); return; }
      return r.json().then(function (d) {
        var nowUri = d.item ? d.item.uri : null;
        var nowPos = d.progress_ms || 0;
        var advanced;
        if (nowUri && snap.uri && nowUri === snap.uri) {
          advanced = nowPos - snap.pos;
        } else if (nowUri) {
          var newIdx = indexOfUri(nowUri);
          if (newIdx > -1 && snap.idx > -1 && newIdx > snap.idx) {
            advanced = (snap.dur - snap.pos) + nowPos;
            for (var i = snap.idx + 1; i < newIdx; i++) advanced += tracks[i].duration_ms;
          } else {
            advanced = null;
          }
        } else {
          advanced = null;
        }
        verdict(report(snap, away, { uri: nowUri, pos: nowPos, playing: d.is_playing, idx: indexOfUri(nowUri) },
                       advanced !== null, advanced));
      });
    }).catch(function (e) { log('background measure failed: ' + e.message, 'bad'); });
  }

  function indexOfUri(uri) {
    for (var i = 0; i < tracks.length; i++) if (tracks[i].uri === uri) return i;
    return -1;
  }

  function report(snap, away, now, haveAdvance, advanced) {
    var lines = [];
    lines.push('BACKGROUND TEST — mode: ' + snap.mode);
    lines.push('away: ' + secs(away));

    // A window this short cannot support a conclusion either way: the advance
    // ratio is dominated by jitter and no track boundary can have passed.
    // Refusing to print a verdict beats printing a wrong one.
    if (away < 15000) {
      lines.push('');
      lines.push('INCONCLUSIVE — too short to measure. Nothing is proven here.');
      lines.push('Re-run: tap "2 · Jump to 20s before end", swipe up to the home');
      lines.push('screen, and stay out of Safari for a full 45 seconds so the');
      lines.push('track boundary passes while you are away.');
      return lines.join('\n');
    }

    var boundaryInWindow = snap.dur > 0 && (snap.dur - snap.pos) < away;
    if (!boundaryInWindow) {
      lines.push('note: the song had ' + secs(snap.dur - snap.pos) + ' left, longer than you were away,');
      lines.push('so CHECK 5 could not fire. Use "2 · Jump to 20s before end" first.');
    }
    if (!now) {
      lines.push('on return: ' + advanced);
      lines.push('CHECK 2: FAIL — audio did not survive backgrounding.');
      return lines.join('\n');
    }
    var changed = snap.uri && now.uri && snap.uri !== now.uri;
    if (haveAdvance) {
      var pct = away > 0 ? Math.round((advanced / away) * 100) : 0;
      lines.push('audio advanced: ' + secs(advanced) + ' (' + pct + '% of wall clock)');
      lines.push('CHECK 2: ' + (pct >= 85 ? 'PASS — audio kept playing while backgrounded.'
                                          : pct >= 15 ? 'PARTIAL — audio ran ' + secs(advanced) + ' then stopped.'
                                                      : 'FAIL — audio stopped on backgrounding.'));
    } else {
      lines.push('audio advance: could not compute (track not in our list)');
    }
    lines.push('still playing on return: ' + (now.playing ? 'yes' : 'no'));
    lines.push('track changed while backgrounded: ' + (changed ? 'YES (' + snap.idx + ' → ' + now.idx + ')' : 'no'));
    if (snap.mode === 'blind') {
      lines.push('CHECK 5: ' + (changed
        ? 'PASS — our JS dispatched the next track while backgrounded.'
        : boundaryInWindow
          ? 'FAIL — the song ended while you were away and nothing started it. JS was suspended.'
          : 'NOT TESTED — no track boundary fell inside the window.'));
    } else {
      lines.push('CHECK 5: n/a in native-queue mode — a transition here is Spotify\'s, not ours.');
    }
    return lines.join('\n');
  }

  /* ---------- foreground ticker ---------- */

  setInterval(function () {
    if (!player || document.visibilityState !== 'visible') return;
    player.getCurrentState().then(function (s) { if (s) onStateChange(s); });
  }, 1000);

  /* ---------- misc buttons ---------- */

  $('b-connect').addEventListener('click', function () {
    location.href = AUTH + '?action=login';
  });

  $('b-logout').addEventListener('click', function () {
    fetch(AUTH + '?action=logout', { credentials: 'same-origin' })
      .then(function () { log('disconnected — reload to reconnect'); });
  });

  $('b-copy').addEventListener('click', function () {
    var out = [];
    out.push('MOTIF SPIKE — Path A / Spotify');
    out.push(navigator.userAgent);
    Array.prototype.forEach.call($('verdicts').children, function (v) { out.push('\n' + v.textContent); });
    out.push('');
    Array.prototype.forEach.call($('log').children, function (li) {
      out.push(li.querySelector('.t').textContent + '  ' + li.querySelector('.m').textContent);
    });
    var text = out.join('\n');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(
        function () { log('log copied to clipboard', 'ok'); },
        function () { log('clipboard blocked — screenshot instead', 'warn'); }
      );
    } else {
      log('clipboard unavailable — screenshot instead', 'warn');
    }
  });
})();
</script>
</body>
</html>
